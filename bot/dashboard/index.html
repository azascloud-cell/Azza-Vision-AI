<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AZZAVISION AI — Trading Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
/* ── Reset & Base ───────────────────────────────────────── */
:root{
  --bg:#080808;--bg2:#0d0b06;--bg3:#111009;
  --gold:#d4a843;--gold-br:#f0c96a;--gold-d:rgba(212,168,67,.13);--gold-b:rgba(212,168,67,.22);--gold-b2:rgba(212,168,67,.45);
  --text:#f5ede0;--muted:#7a6a54;--muted2:#3a3020;
  --win:#4caf79;--win-d:rgba(76,175,121,.13);--win-b:rgba(76,175,121,.3);
  --loss:#e05a5a;--loss-d:rgba(224,90,90,.13);--loss-b:rgba(224,90,90,.3);
  --blue:#4a9ecf;--blue-d:rgba(74,158,207,.13);
  --warn:#e08020;--warn-d:rgba(224,128,32,.13);
  --r:10px;--shadow:0 4px 24px rgba(0,0,0,.6);
  --font:'Poppins',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;min-height:100vh;-webkit-tap-highlight-color:transparent}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 40% at 50% -5%,rgba(212,168,67,.07) 0%,transparent 70%),url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='1' height='1' x='0' y='0' fill='%23d4a843' fill-opacity='0.03'/%3E%3Crect width='1' height='1' x='20' y='20' fill='%23d4a843' fill-opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:0}
#app{position:relative;z-index:1;max-width:1360px;margin:0 auto;padding:20px 14px 60px}
button{font-family:var(--font);cursor:pointer}
a{color:inherit;text-decoration:none}
input,textarea,select{font-family:var(--font)}

/* ── Scrollbar ──────────────────────────────────────────── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:rgba(255,255,255,.03)}
::-webkit-scrollbar-thumb{background:var(--gold-b);border-radius:99px}

/* ── Utility ────────────────────────────────────────────── */
.sec-label{font-size:9px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.card{background:var(--bg2);border:1px solid var(--gold-b);border-radius:var(--r);padding:16px}
.glass{background:rgba(13,11,6,.75);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.divider{border:none;border-top:1px solid var(--gold-b);margin:14px 0}

/* ── Badges & pills ─────────────────────────────────────── */
.pill{display:inline-flex;align-items:center;border-radius:5px;padding:2px 8px;font-size:9px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
.pill.open{background:var(--blue-d);color:var(--blue);border:1px solid rgba(74,158,207,.3)}
.pill.win,.pill.tp1,.pill.tp2{background:var(--win-d);color:var(--win);border:1px solid var(--win-b)}
.pill.loss,.pill.sl{background:var(--loss-d);color:var(--loss);border:1px solid var(--loss-b)}
.pill.be,.pill.breakeven{background:var(--warn-d);color:var(--warn);border:1px solid rgba(224,128,32,.3)}
.pill.other{background:rgba(255,255,255,.05);color:var(--muted);border:1px solid rgba(255,255,255,.1)}
.buy-txt{color:var(--win);font-weight:700}
.sell-txt{color:var(--loss);font-weight:700}

/* ── Btn ────────────────────────────────────────────────── */
.btn{border:1px solid var(--gold-b2);border-radius:8px;background:var(--gold-d);color:var(--gold);font-weight:700;font-size:11px;letter-spacing:.06em;padding:7px 16px;text-transform:uppercase;transition:background .15s}
.btn:hover{background:rgba(212,168,67,.24)}
.btn:disabled{opacity:.4;cursor:wait}
.btn-sm{padding:5px 12px;font-size:10px;border-radius:6px}
.btn-ghost{background:transparent;border:1px solid var(--muted2);color:var(--muted)}
.btn-ghost:hover{background:rgba(255,255,255,.04);color:var(--text)}
.btn-win{background:var(--win-d);border-color:var(--win-b);color:var(--win)}
.btn-loss{background:var(--loss-d);border-color:var(--loss-b);color:var(--loss)}

/* ── Header ─────────────────────────────────────────────── */
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid var(--gold-b);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;flex-shrink:0}
.brand-name{font-size:16px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.brand-sub{font-size:8px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-top:1px}
.hdr-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.status-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--gold-b2);border-radius:999px;padding:5px 13px;background:var(--gold-d);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0}
.dot.live{background:var(--win);box-shadow:0 0 0 3px rgba(76,175,121,.25);animation:pulse 2s infinite}
.dot.error{background:var(--loss);box-shadow:0 0 0 3px rgba(224,90,90,.2)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

/* ── Nav tabs ────────────────────────────────────────────── */
.nav{display:flex;gap:6px;margin-bottom:24px}
.nav-item{padding:8px 18px;border-radius:8px;border:1px solid transparent;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);cursor:pointer;transition:all .15s;background:none}
.nav-item.active{background:var(--gold-d);border-color:var(--gold-b2);color:var(--gold)}
.nav-item:hover:not(.active){background:rgba(255,255,255,.04);color:var(--text)}

/* ── Stat cards ─────────────────────────────────────────── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}}
.scard{background:var(--bg2);border:1px solid var(--gold-b);border-radius:var(--r);padding:14px 16px;position:relative;overflow:hidden}
.scard::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(212,168,67,.04) 0%,transparent 60%)}
.scard-lbl{font-size:8px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.scard-val{font-size:22px;font-weight:800;color:var(--gold-br);line-height:1}
.scard-sub{font-size:10px;color:var(--muted);margin-top:4px}
.scard.win .scard-val{color:var(--win)}
.scard.loss .scard-val{color:var(--loss)}

/* ── Dashboard layout ───────────────────────────────────── */
.dash-layout{display:grid;grid-template-columns:1fr 300px;gap:16px}
@media(max-width:900px){.dash-layout{grid-template-columns:1fr}}
.dash-main{display:flex;flex-direction:column;gap:16px}
.dash-side{display:flex;flex-direction:column;gap:16px}

/* ── Signal cards ────────────────────────────────────────── */
.sig-list{display:flex;flex-direction:column;gap:8px}
.sig-card{background:var(--bg2);border:1px solid var(--gold-b);border-radius:var(--r);padding:14px 16px;cursor:pointer;transition:all .18s;position:relative;overflow:hidden}
.sig-card::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(212,168,67,.03),transparent);opacity:0;transition:opacity .18s}
.sig-card:hover{border-color:var(--gold-b2);transform:translateX(2px);box-shadow:0 4px 20px rgba(212,168,67,.1)}
.sig-card:hover::after{opacity:1}
.sig-card:active{transform:translateX(0)}
.sc-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap;gap:6px}
.sc-pair{font-size:15px;font-weight:800;letter-spacing:.06em}
.sc-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sc-body{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 12px}
@media(max-width:480px){.sc-body{grid-template-columns:repeat(2,1fr)}}
.sc-field{display:flex;flex-direction:column;gap:2px}
.sc-lbl{font-size:8px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sc-val{font-size:12px;font-weight:700}
.sc-arrow{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);opacity:.4;font-size:16px;transition:opacity .15s,transform .15s}
.sig-card:hover .sc-arrow{opacity:.9;transform:translateY(-50%) translateX(2px)}
.conf-bar-wrap{display:flex;align-items:center;gap:5px;margin-top:8px;padding-top:8px;border-top:1px solid rgba(212,168,67,.08)}
.conf-bar{flex:1;height:3px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.conf-fill{height:100%;border-radius:inherit;transition:width .4s}
.conf-txt{font-size:10px;font-weight:700;color:var(--gold)}

/* ── Signal Detail Page ─────────────────────────────────── */
.detail-hdr{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.back-btn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.04);border:1px solid var(--muted2);border-radius:8px;padding:7px 14px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;transition:all .15s}
.back-btn:hover{background:rgba(255,255,255,.07);color:var(--text)}
.detail-title{flex:1;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.detail-pair{font-size:24px;font-weight:900;letter-spacing:.08em}
.detail-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:860px){.detail-layout{grid-template-columns:1fr}}
.detail-wide{grid-column:1/-1}

/* ── Level grid ─────────────────────────────────────────── */
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
@media(max-width:480px){.levels{grid-template-columns:repeat(2,1fr)}}
.level-item{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:10px 12px;text-align:center}
.level-item.entry{border-color:rgba(74,158,207,.25);background:rgba(74,158,207,.05)}
.level-item.sl{border-color:rgba(224,90,90,.2);background:rgba(224,90,90,.04)}
.level-item.tp1,.level-item.tp2{border-color:rgba(76,175,121,.2);background:rgba(76,175,121,.04)}
.level-lbl{font-size:8px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.level-val{font-size:18px;font-weight:800;letter-spacing:.03em}
.level-item.entry .level-val{color:var(--blue)}
.level-item.sl .level-val{color:var(--loss)}
.level-item.tp1 .level-val,.level-item.tp2 .level-val{color:var(--win)}

/* ── Market conditions ──────────────────────────────────── */
.market-grid{display:flex;flex-direction:column;gap:8px}
.mkt-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.02);transition:border-color .15s}
.mkt-ico{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0}
.mkt-ico.bull{background:var(--win-d);border:1px solid var(--win-b);color:var(--win)}
.mkt-ico.bear{background:var(--loss-d);border:1px solid var(--loss-b);color:var(--loss)}
.mkt-ico.neut{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:var(--muted)}
.mkt-ico.warn{background:var(--warn-d);border:1px solid rgba(224,128,32,.3);color:var(--warn)}
.mkt-info{flex:1}
.mkt-lbl{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mkt-val{font-size:12px;font-weight:700;margin-top:1px}

/* ── Timeline ───────────────────────────────────────────── */
.timeline{display:flex;flex-direction:column;gap:0;position:relative;padding-left:32px}
.tl-item{display:flex;align-items:flex-start;gap:12px;position:relative;padding-bottom:18px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:'';position:absolute;left:-24px;top:18px;bottom:0;width:1px;background:linear-gradient(to bottom,var(--gold-b),transparent)}
.tl-item:last-child::before{display:none}
.tl-dot{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;flex-shrink:0;position:absolute;left:-32px;top:2px;border:2px solid var(--gold-b);background:var(--bg2);color:var(--gold);transition:all .2s}
.tl-dot.done{background:var(--gold-d);border-color:var(--gold-b2);color:var(--gold-br)}
.tl-dot.win-dot{background:var(--win-d);border-color:var(--win-b);color:var(--win)}
.tl-dot.loss-dot{background:var(--loss-d);border-color:var(--loss-b);color:var(--loss)}
.tl-dot.pending{opacity:.35}
.tl-content{}
.tl-event{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.tl-time{font-size:10px;color:var(--muted);margin-top:2px}

/* ── RR display ─────────────────────────────────────────── */
.rr-wrap{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:8px;background:var(--gold-d);border:1px solid var(--gold-b)}
.rr-label{font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.rr-val{font-size:20px;font-weight:900;color:var(--gold-br)}

/* ── Journal form ───────────────────────────────────────── */
.journal-form{display:flex;flex-direction:column;gap:12px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.form-row{grid-template-columns:1fr}}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-label{font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.form-input,.form-textarea,.form-select{background:rgba(255,255,255,.04);border:1px solid var(--muted2);border-radius:7px;color:var(--text);font-size:12px;padding:8px 11px;transition:border-color .15s;outline:none;width:100%}
.form-input:focus,.form-textarea:focus,.form-select:focus{border-color:var(--gold-b2)}
.form-textarea{resize:vertical;min-height:80px}
.form-select option{background:var(--bg2)}
.form-check-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:480px){.form-check-grid{grid-template-columns:repeat(2,1fr)}}
.check-item{display:flex;align-items:center;gap:7px;cursor:pointer;padding:7px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.02);transition:all .15s;user-select:none}
.check-item:hover{border-color:var(--gold-b);background:var(--gold-d)}
.check-item input{display:none}
.check-box{width:14px;height:14px;border-radius:3px;border:1px solid var(--muted);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;transition:all .15s}
.check-item.checked .check-box{background:var(--gold-d);border-color:var(--gold-b2);color:var(--gold)}
.check-lbl{font-size:10px;font-weight:600;color:var(--muted)}
.check-item.checked .check-lbl{color:var(--text)}
.save-status{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:600;padding:5px 10px;border-radius:6px}
.save-status.ok{background:var(--win-d);border:1px solid var(--win-b);color:var(--win)}
.save-status.err{background:var(--loss-d);border:1px solid var(--loss-b);color:var(--loss)}

/* ── Journal page ───────────────────────────────────────── */
.journal-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.filter-group{display:flex;gap:4px}
.filter-btn{padding:5px 12px;border-radius:6px;border:1px solid var(--muted2);background:transparent;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:all .15s}
.filter-btn.active{background:var(--gold-d);border-color:var(--gold-b2);color:var(--gold)}
.filter-btn:hover:not(.active){background:rgba(255,255,255,.04);color:var(--text)}
.search-box{flex:1;min-width:160px;background:rgba(255,255,255,.04);border:1px solid var(--muted2);border-radius:7px;color:var(--text);font-size:12px;padding:6px 12px;outline:none;transition:border-color .15s}
.search-box:focus{border-color:var(--gold-b2)}
.journal-entries{display:flex;flex-direction:column;gap:10px}
.je-card{background:var(--bg2);border:1px solid var(--gold-b);border-radius:var(--r);padding:14px 16px;cursor:pointer;transition:all .18s}
.je-card:hover{border-color:var(--gold-b2);transform:translateX(2px)}
.je-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:6px}
.je-pair{font-size:14px;font-weight:800;letter-spacing:.06em}
.je-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 12px;margin-top:8px}
@media(max-width:500px){.je-meta{grid-template-columns:repeat(2,1fr)}}
.je-field{display:flex;flex-direction:column;gap:2px}
.je-lbl{font-size:8px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.je-val{font-size:11px;font-weight:700}
.export-row{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}

/* ── Server panel ───────────────────────────────────────── */
.srv-card{padding:14px 16px}
.srv-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.srv-state{display:inline-flex;align-items:center;gap:6px;font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.res{margin-bottom:10px}
.res:last-of-type{margin-bottom:0}
.res-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.res-name{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.res-val{font-size:11px;font-weight:700}
.bar{height:4px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}
.bar-fill{height:100%;border-radius:inherit;transition:width .4s;background:linear-gradient(90deg,rgba(212,168,67,.4),var(--gold))}
.bar-fill.mem{background:linear-gradient(90deg,var(--blue-d),var(--blue))}
.bar-fill.hi{background:linear-gradient(90deg,rgba(200,130,0,.5),#e08020)}
.bar-fill.crit{background:linear-gradient(90deg,rgba(180,0,0,.5),var(--loss))}

/* ── Mascot ─────────────────────────────────────────────── */
.mascot-wrap{position:fixed;bottom:20px;right:20px;z-index:50;user-select:none;pointer-events:none}
.mascot-float{animation:mascot-float 3s ease-in-out infinite}
@keyframes mascot-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.mascot-bubble{position:absolute;bottom:100%;right:10px;margin-bottom:8px;background:rgba(13,11,6,.92);border:1px solid var(--gold-b2);border-radius:10px;padding:8px 12px;font-size:10px;font-weight:600;color:var(--gold-br);white-space:nowrap;max-width:160px;white-space:normal;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.5);opacity:0;transform:translateY(4px);transition:all .3s}
.mascot-bubble::after{content:'';position:absolute;bottom:-6px;right:20px;width:10px;height:6px;background:var(--gold-b2);clip-path:polygon(0 0,100% 0,50% 100%)}
.mascot-wrap:hover .mascot-bubble,.mascot-bubble.show{opacity:1;transform:translateY(0)}

/* ── Azza Chibi SVG ─────────────────────────────────────── */
.azza-svg{width:72px;height:72px;filter:drop-shadow(0 0 8px rgba(212,168,67,.35))}
.eye-l,.eye-r{transition:all .3s}
.mouth{transition:all .3s}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(0.05)}}
.eye-l,.eye-r{animation:blink 3.5s infinite}
@keyframes azza-scan{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.expr-scanning .eyes-group{animation:azza-scan 1.2s linear infinite}
@keyframes azza-think{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg)}}
.expr-thinking .azza-head{animation:azza-think 1.8s ease-in-out infinite}
.expr-happy .mouth{d:path("M 22 34 Q 28 40 34 34");stroke:var(--win)}
.expr-sad .mouth{d:path("M 22 37 Q 28 33 34 37");stroke:var(--loss)}
@keyframes azza-celebrate{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-10deg) scale(1.05)}75%{transform:rotate(10deg) scale(1.05)}}
.expr-celebrate .azza-body{animation:azza-celebrate .6s ease-in-out infinite}
@keyframes azza-zz{0%{opacity:0;transform:translate(0,0) scale(.6)}100%{opacity:1;transform:translate(8px,-12px) scale(1)}}
.zzz{font-size:10px;font-weight:900;fill:var(--muted);animation:azza-zz 2s ease-out infinite;animation-delay:calc(var(--d)*0.6s)}

/* ── Checklist ──────────────────────────────────────────── */
.feat-list{display:flex;flex-direction:column;gap:6px}

<div id="app"></div>

<!-- ═══════════════════════════════════════════════════════════════ SCRIPTS -->
<script>
'use strict';
const API = '';  // same-origin, no prefix needed

/* ── Formatters ─────────────────────────────────────────── */
const fmt = {
  price: v => v == null ? '—' : Number(v).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:5}),
  pct:   v => v == null ? '—' : Number(v).toFixed(1) + '%',
  pips:  v => v == null ? '—' : (v > 0 ? '+' : '') + Number(v).toFixed(0),
  rr:    (entry, sl, tp) => {
    if (entry == null || sl == null || tp == null) return null;
    const risk   = Math.abs(entry - sl);
    const reward = Math.abs(tp - entry);
    if (risk === 0) return null;
    return (reward / risk).toFixed(2);
  },
  dt: v => { try { return new Date(v).toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); } catch { return v; } },
  date: v => { try { return new Date(v).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}); } catch { return v; } },
  dur:  (a, b) => {
    if (!a || !b) return '—';
    const ms = Math.abs(new Date(b) - new Date(a));
    const m = Math.floor(ms / 60000);
    if (m < 60) return m + ' menit';
    const h = Math.floor(m / 60), rm = m % 60;
    return h + 'j ' + rm + 'm';
  },
  bytes: v => {
    if (!v) return '—';
    const gb = v / 1073741824;
    if (gb >= 0.5) return gb.toFixed(2) + ' GB';
    return (v / 1048576).toFixed(0) + ' MB';
  },
  uptime: ms => {
    if (!ms) return '—';
    const s = Math.floor(ms/1000), m = Math.floor(s/60), h = Math.floor(m/60), d = Math.floor(h/24);
    if (d > 0) return d + 'd ' + (h%24) + 'h';
    if (h > 0) return h + 'h ' + (m%60) + 'm';
    return m + 'm';
  },
};

/* ── Status helpers ─────────────────────────────────────── */
function statusPill(status) {
  const s = (status || 'OPEN').toUpperCase();
  let cls = 'other', label = s;
  if (['WIN','TP2','TP1_HIT'].includes(s)) { cls = 'win'; label = s === 'WIN' ? 'WIN' : s; }
  else if (s === 'TP1' || s === 'TP1_BREAKEVEN') { cls = 'tp1'; label = 'TP1'; }
  else if (['LOSS','STOP_LOSS','SL','STOPLOSS'].includes(s)) { cls = 'loss'; label = 'STOP LOSS'; }
  else if (['BREAKEVEN','BE','BREAKEVEN_HIT'].includes(s)) { cls = 'be'; label = 'BREAKEVEN'; }
  else if (s === 'OPEN') { cls = 'open'; label = 'OPEN'; }
  return `<span class="pill ${cls}">${label}</span>`;
}

function biasClass(b) {
  if (!b) return 'neut';
  const v = b.toUpperCase();
  if (v.includes('BUY') || v === 'LONG' || v === 'BULLISH') return 'bull';
  if (v.includes('SELL') || v === 'SHORT' || v === 'BEARISH') return 'bear';
  if (v.includes('STRONG')) return v.includes('BUY') ? 'bull' : 'bear';
  return 'neut';
}

function confColor(v) {
  if (v == null) return 'var(--gold)';
  const n = v > 1 ? v : v * 100;
  if (n >= 85) return 'var(--win)';
  if (n >= 70) return 'var(--gold)';
  return 'var(--loss)';
}

/* ── Router ─────────────────────────────────────────────── */
let currentRoute = '/';
function navigate(path) { window.location.hash = '#' + path; }
function getRoute() { return window.location.hash.replace('#', '') || '/'; }

/* ── State ──────────────────────────────────────────────── */
const state = {
  overview: null,
  allSignals: [],
  currentSignal: null,
  journal: {},
  journalEntries: [],
  lastSync: null,
  connStatus: 'connecting',
  journalFilter: { period: 'all', result: 'all', search: '' },
};

/* ── Fetch helpers ──────────────────────────────────────── */
async function apiFetch(path) {
  const r = await fetch(API + path + '?_=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function apiPut(path, body) {
  const r = await fetch(API + path, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body), cache: 'no-store',
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

    <ellipse cx="38" cy="28" rx="5" ry="3" fill="#e08070" opacity="${blushOpacity}"/>

}

function mascotExprForSignal(sig) {
  if (!sig) return 'default';
  const s = (sig.status || '').toUpperCase();
  const side = (sig.side || '').toUpperCase();
  if (['WIN','TP2'].includes(s)) return 'tphit';
  if (['TP1','TP1_HIT','TP1_BREAKEVEN'].includes(s)) return 'happy';
  if (['BREAKEVEN','BE'].includes(s)) return 'thinking';
  if (['LOSS','STOP_LOSS','SL'].includes(s)) return 'stoploss';
  if (s === 'OPEN') return side === 'BUY' ? 'buy' : side === 'SELL' ? 'sell' : 'scanning';
  return 'default';
}

function mascotMessage(expr) {
  const msgs = {
    default: 'Halo! Pilih signal untuk detail.',

}

/* ════════════════════════════════════════ RENDER HEADER */
function renderHeader(activeTab) {
  const tabs = [
    { id: '/', label: 'Dashboard' },
    { id: '/journal', label: 'Journal' },
    { id: '/studio', label: '\uD83C\uDFAC Studio' },
  ];

  return `
<header class="hdr">
  <div class="brand">
    ${logoSVG()}
    <div>
      <div class="brand-name">AZZAVISION AI</div>
      <div class="brand-sub">Professional Trading Monitor</div>
    </div>
  </div>
  <div class="hdr-right">
    <div class="status-chip" id="conn-chip">
      <div class="dot ${state.connStatus === 'live' ? 'live' : state.connStatus === 'error' ? 'error' : ''}"></div>
      ${state.connStatus === 'live' ? 'Live' : state.connStatus === 'error' ? 'Unavailable' : 'Connecting'}
    </div>
    <button class="btn btn-sm" id="btn-refresh" onclick="loadOverview()">Refresh</button>
  </div>
</header>
<nav class="nav">
  ${tabs.map(t => `<button class="nav-item ${activeTab === t.id ? 'active' : ''}" onclick="navigate('${t.id}')">${t.label}</button>`).join('')}
</nav>`;
}

/* ════════════════════════════════════════ DASHBOARD PAGE */
async function loadOverview() {
  const btn = document.getElementById('btn-refresh');
  if (btn) btn.disabled = true;
  try {
    const data = await apiFetch('/api/trading/overview');
    state.overview = data;
    state.allSignals = data.signals || [];
    state.lastSync = new Date();
    state.connStatus = 'live';
    renderDashboard();
  } catch (err) {
    state.connStatus = 'error';
    renderDashboard();
  } finally {
    const b = document.getElementById('btn-refresh');
    if (b) b.disabled = false;
  }
}

function renderDashboard() {
  const app = document.getElementById('app');
  if (!app) return;
  const s = state.overview?.stats;
  const srv = state.overview?.server;
  const sigs = state.allSignals;

  app.innerHTML = renderHeader('/') + `
<div class="stats">
  <div class="scard">
    <div class="scard-lbl">Total Signals</div>
    <div class="scard-val">${s ? s.totalSignals : '—'}</div>
    <div class="scard-sub">${s ? s.openSignals + ' open' : ''}</div>
  </div>
  <div class="scard ${s && s.winRate >= 50 ? 'win' : s ? 'loss' : ''}">
    <div class="scard-lbl">Win Rate</div>
    <div class="scard-val">${s ? s.winRate.toFixed(1) + '%' : '—'}</div>
    <div class="scard-sub">${s ? s.winningSignals + 'W / ' + s.losingSignals + 'L' : ''}</div>
  </div>
  <div class="scard ${s && s.totalPips > 0 ? 'win' : s && s.totalPips < 0 ? 'loss' : ''}">
    <div class="scard-lbl">Total Pips</div>
    <div class="scard-val">${s ? fmt.pips(s.totalPips) : '—'}</div>
    <div class="scard-sub">${s ? 'avg ' + fmt.pips(s.averagePips) + '/trade' : ''}</div>
  </div>
  <div class="scard">
    <div class="scard-lbl">Last Signal</div>
    <div class="scard-val" style="font-size:12px;padding-top:5px">${s?.lastSignalAt ? fmt.dt(s.lastSignalAt) : '—'}</div>
    <div class="scard-sub">${s ? s.closedSignals + ' closed' : ''}</div>
  </div>
</div>

<div class="dash-layout">
  <div class="dash-main">
    <div class="card">
      <div class="sec-label">Signal Stream</div>
      ${state.connStatus === 'error'
        ? '<div class="err-box">Tidak dapat terhubung ke server. Pastikan dashboard berjalan.</div>'
        : sigs.length === 0
          ? '<div class="empty-box">Belum ada signal tersedia.</div>'
          : `<div class="sig-list">${sigs.map(sig => renderSignalCard(sig)).join('')}</div>`
      }
      ${state.lastSync ? `<div style="font-size:10px;color:var(--muted);margin-top:12px;text-align:right">Sync: ${fmt.dt(state.lastSync)}</div>` : ''}
    </div>
  </div>
  <div class="dash-side">
    ${srv ? renderServerCard(srv) : ''}
    ${sigs.length > 0 ? renderChecklist(sigs[0]) : ''}

function renderTimeline(sig) {
  const isDone = (v) => v === true || v != null;
  const status = (sig.status || '').toUpperCase();
  const isClosed = Boolean(sig.closedAt) || ['WIN','LOSS','BREAKEVEN','TP1','TP2','STOP_LOSS'].includes(status);
  const isTP1 = sig.tp1Hit || ['TP1','TP2','WIN','TP1_HIT','TP1_BREAKEVEN'].includes(status);
  const isBE  = sig.breakeven || sig._raw?.breakeven_triggered;
  const isTP2 = ['TP2','WIN'].includes(status);
  const isSL  = ['LOSS','STOP_LOSS','SL','STOPLOSS'].includes(status);

  const steps = [
    { label: 'Signal Dibuat', time: sig.createdAt, cls: 'done', icon: '★' },
    { label: 'Market Scan', time: sig.createdAt, cls: 'done', icon: '◉' },
    { label: 'Entry', time: sig.createdAt, cls: sig.entry ? 'done' : 'pending', icon: '▶' },
    { label: 'TP1', time: null, cls: isTP1 ? 'win-dot' : 'pending', icon: '✓' },
    { label: 'Breakeven', time: null, cls: isBE ? 'done' : 'pending', icon: '—' },
    { label: 'TP2', time: null, cls: isTP2 ? 'win-dot' : 'pending', icon: '✓' },
    isSL
      ? { label: 'Stop Loss', time: sig.closedAt, cls: 'loss-dot', icon: '✕' }
      : { label: 'Closed', time: sig.closedAt, cls: isClosed ? 'done' : 'pending', icon: '■' },
  ];

  return `<div class="timeline">
  ${steps.map(step => `<div class="tl-item">
    <div class="tl-dot ${step.cls}">${step.icon}</div>
    <div class="tl-content">
      <div class="tl-event">${step.label}</div>
      ${step.time ? `<div class="tl-time">${fmt.dt(step.time)}</div>` : `<div class="tl-time" style="opacity:.35">Pending</div>`}
    </div>
  </div>`).join('')}
</div>`;
}

async function saveJournal(signalId) {
  const statusEl = document.getElementById('save-status');
  if (statusEl) { statusEl.innerHTML = '<span style="font-size:10px;color:var(--muted)">Menyimpan...</span>'; }
  const checks = {};
  document.querySelectorAll('.check-item').forEach(item => {
    const key = item.dataset.key.replace(/ /g,'_').toLowerCase();
    checks[key] = item.classList.contains('checked');
  });
  const body = {
    date:          document.getElementById('jf-date')?.value,
    entryTime:     document.getElementById('jf-entry-time')?.value,
    exitTime:      document.getElementById('jf-exit-time')?.value,
    duration:      document.getElementById('jf-duration')?.value,
    newsFilter:    document.getElementById('jf-news')?.value,
    riskReward:    document.getElementById('jf-rr')?.value,
    aiConfidence:  document.getElementById('jf-confidence')?.value,
    reasonEntry:   document.getElementById('jf-reason')?.value,
    aiConclusion:  document.getElementById('jf-ai-conclusion')?.value,
    traderNotes:   document.getElementById('jf-notes')?.value,
    ...checks,
    signalId,
  };
  try {
    await apiPut('/api/journal/' + encodeURIComponent(signalId), body);
    if (statusEl) statusEl.innerHTML = '<div class="save-status ok">Tersimpan</div>';
    setTimeout(() => { if (statusEl) statusEl.innerHTML = ''; }, 3000);
  } catch (err) {
    if (statusEl) statusEl.innerHTML = `<div class="save-status err">Gagal: ${err.message}</div>`;
  }
}

function renderJournalPage() {
  const app = document.getElementById('app');
  if (!app) return;
  const f = state.journalFilter;

  // Build combined records: signals as base, journal entries as overlay
  const sigMap = {};
  state.allSignals.forEach(s => { sigMap[String(s.id)] = s; });
  const jeMap = {};
  state.journalEntries.forEach(e => { jeMap[String(e.signalId)] = e; });

  // Build combined list
  let records = state.allSignals.map(sig => ({
    sig,
    journal: jeMap[String(sig.id)] || null,
  }));

  // Filter
  if (f.period !== 'all') {
    const now = Date.now();
    const ms = { day: 86400000, week: 604800000, month: 2592000000 }[f.period] || 0;
    records = records.filter(r => r.sig.createdAt && (now - new Date(r.sig.createdAt).getTime()) < ms);
  }
  if (f.result !== 'all') {
    records = records.filter(r => {
      const s = (r.sig.status || '').toUpperCase();
      if (f.result === 'win')  return ['WIN','TP1','TP2','TP1_HIT'].includes(s);
      if (f.result === 'loss') return ['LOSS','STOP_LOSS','SL'].includes(s);
      if (f.result === 'be')   return ['BREAKEVEN','BE','TP1_BREAKEVEN'].includes(s);
      return true;
    });
  }
  if (f.search) {
    const q = f.search.toLowerCase();
    records = records.filter(r =>
      (r.sig.symbol || r.sig.pair || '').toLowerCase().includes(q) ||
      (r.sig.createdAt || '').toLowerCase().includes(q) ||
      (r.journal?.traderNotes || '').toLowerCase().includes(q)
    );
  }

  const pips = records.map(r => r.sig.pips).filter(v => v != null);
  const totalPips = pips.reduce((a,b) => a+b, 0);
  const wins = records.filter(r => ['WIN','TP1','TP2','TP1_HIT'].includes((r.sig.status||'').toUpperCase())).length;
  const wr = records.length ? (wins / records.length * 100).toFixed(1) : '—';

  app.innerHTML = renderHeader('/journal') + `
<div class="stats" style="margin-bottom:16px">
  <div class="scard"><div class="scard-lbl">Total Trade</div><div class="scard-val">${records.length}</div></div>
  <div class="scard ${wins/records.length >= 0.5 ? 'win' : 'loss'}"><div class="scard-lbl">Win Rate</div><div class="scard-val">${wr}%</div></div>
  <div class="scard ${totalPips >= 0 ? 'win' : 'loss'}"><div class="scard-lbl">Total Pips</div><div class="scard-val">${fmt.pips(totalPips)}</div></div>
  <div class="scard"><div class="scard-lbl">Dengan Journal</div><div class="scard-val">${state.journalEntries.length}</div></div>
</div>

<div class="journal-filters">
  <div class="filter-group">
    ${['all','day','week','month'].map(p => `<button class="filter-btn ${f.period===p?'active':''}" onclick="setJFilter('period','${p}')">${{all:'Semua',day:'Hari Ini',week:'Minggu',month:'Bulan'}[p]}</button>`).join('')}
  </div>
  <div class="filter-group">
    ${['all','win','loss','be'].map(r => `<button class="filter-btn ${f.result===r?'active':''}" onclick="setJFilter('result','${r}')">${{all:'Semua',win:'Win',loss:'Loss',be:'BE'}[r]}</button>`).join('')}
  </div>
  <input class="search-box" id="journal-search" placeholder="Cari pair / tanggal..." value="${f.search}" oninput="setJFilter('search',this.value)"/>
</div>

/* ════════════════════════════════════════ EXPORTS */
function exportCSV() {
  const rows = [
    ['ID','Pair','Side','Status','Entry','SL','TP1','TP2','Pips','Confidence','H4','M15','Created','Closed'],
  ];
  state.allSignals.forEach(s => {
    rows.push([s.id, s.symbol, s.side, s.status, s.entry, s.sl, s.tp1, s.tp2, s.pips, s.confidence, s.h4Bias, s.m15Bias, s.createdAt, s.closedAt]);
  });
  const csv = rows.map(r => r.map(v => `"${String(v || '').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'azzavision_journal_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
}

function exportPDF() {
  const win = window.open('', '_blank');
  if (!win) return;
  const rows = state.allSignals.slice(0, 100).map(s => `
    <tr>
      <td>${s.id}</td><td>${s.symbol}</td><td style="color:${s.side==='BUY'?'#4caf79':'#e05a5a'}">${s.side}</td>
      <td>${s.status}</td><td>${fmt.price(s.entry)}</td><td>${fmt.pips(s.pips)}</td>
      <td>${s.createdAt ? fmt.dt(s.createdAt) : '—'}</td>
    </tr>`).join('');
  win.document.write(`<!doctype html><html><head><title>AZZAVISION Journal</title>
  <style>body{font-family:Arial,sans-serif;font-size:11px;background:#080808;color:#f5ede0}
  h1{color:#d4a843;font-size:16px}table{width:100%;border-collapse:collapse}
  th{background:#1a1208;color:#d4a843;padding:6px 8px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;border:1px solid rgba(212,168,67,.2)}
  td{padding:5px 8px;border:1px solid rgba(255,255,255,.07);font-size:10px}
  tr:nth-child(even){background:rgba(255,255,255,.02)}</style></head>
  <body><h1>AZZAVISION AI — Trading Journal</h1>
  <p style="color:#7a6a54;font-size:10px">Export: ${new Date().toLocaleString('id-ID')}</p>
  <table><thead><tr><th>ID</th><th>Pair</th><th>Side</th><th>Status</th><th>Entry</th><th>Pips</th><th>Waktu</th></tr></thead>

async function router() {
  const route = getRoute();
  const signalMatch = route.match(/^\/signal\/(.+)$/);

  if (route === '/') {
    if (!state.overview) await loadOverview();
    else renderDashboard();
  } else if (signalMatch) {
    await loadSignalDetail(decodeURIComponent(signalMatch[1]));
  } else if (route === '/journal') {
    await loadJournal();
  } else if (route === '/studio') {
    await loadStudio();
  } else {
    navigate('/');
  }
}

    }
    function _toast(m){const t=document.createElement('div');t.textContent=m;Object.assign(t.style,{position:'fixed',bottom:'80px',left:'50%',transform:'translateX(-50%)',background:'rgba(212,168,67,.95)',color:'#000',padding:'7px 16px',borderRadius:'20px',fontWeight:'700',fontSize:'12px',zIndex:'9999',transition:'opacity .3s'});document.body.appendChild(t);setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300);},1800);}

    async function _renderCardDataUrl(){
    // Preload Poppins for canvas — fall back to Arial if unavailable
    let fontName='Arial';
    try{
      const pf=new FontFace('Poppins','url(https://fonts.gstatic.com/s/poppins/v21/pxiEyp8kv8JHgFVrJJfecg.woff2)');
      await pf.load();document.fonts.add(pf);fontName='Poppins';
    }catch(e){}
    const cur=_st.cur;if(!cur)return;
    const cv=document.createElement('canvas'),W=1080,H=1920;cv.width=W;cv.height=H;
    const c=cv.getContext('2d');
    // Load background image for current theme
    await new Promise(res=>{
      const img=new Image();img.crossOrigin='anonymous';
      img.onload=()=>{c.drawImage(img,0,0,W,H);res();};
      img.onerror=()=>{
        const fb=c.createLinearGradient(0,0,0,H);fb.addColorStop(0,'#050810');fb.addColorStop(.45,'#0a1520');fb.addColorStop(1,'#020408');
        c.fillStyle=fb;c.fillRect(0,0,W,H);res();
      };
      img.src=_bgUrl(_st.theme);
    });
    // Dark overlay so card text stays readable over any background
    const ov=c.createLinearGradient(0,0,0,H);ov.addColorStop(0,'rgba(0,0,0,.52)');ov.addColorStop(1,'rgba(0,0,0,.42)');
    c.fillStyle=ov;c.fillRect(0,0,W,H);
    const cx=W*.05,cy=H*.07,cw=W*.9,ch=H*.7,cr=32;
    c.beginPath();if(c.roundRect)c.roundRect(cx,cy,cw,ch,cr);else{c.moveTo(cx+cr,cy);c.lineTo(cx+cw-cr,cy);c.arcTo(cx+cw,cy,cx+cw,cy+cr,cr);c.lineTo(cx+cw,cy+ch-cr);c.arcTo(cx+cw,cy+ch,cx+cw-cr,cy+ch,cr);c.lineTo(cx+cr,cy+ch);c.arcTo(cx,cy+ch,cx,cy+ch-cr,cr);c.lineTo(cx,cy+cr);c.arcTo(cx,cy,cx+cr,cy,cr);}
    c.fillStyle='rgba(14,12,7,.93)';c.fill();c.strokeStyle='rgba(212,168,67,.22)';c.lineWidth=2;c.stroke();
    c.beginPath();if(c.roundRect)c.roundRect(cx,cy,cw,80,[cr,cr,0,0]);else{c.moveTo(cx+cr,cy);c.lineTo(cx+cw-cr,cy);c.arcTo(cx+cw,cy,cx+cw,cy+cr,cr);c.lineTo(cx+cw,cy+80);c.lineTo(cx,cy+80);c.arcTo(cx,cy,cx+cr,cy,cr);}
    c.fillStyle='rgba(8,7,3,.96)';c.fill();
    c.beginPath();if(c.roundRect)c.roundRect(cx+22,cy+16,48,48,12);else c.rect(cx+22,cy+16,48,48);
    c.fillStyle='#25D366';c.fill();
    c.fillStyle='#fff';c.font='bold 28px '+fontName;c.textAlign='center';c.fillText('✓',cx+46,cy+48);
    c.fillStyle='rgba(245,237,224,.9)';c.font='bold 22px '+fontName;c.textAlign='left';c.fillText('WHATSAPP',cx+82,cy+49);
    c.fillStyle='rgba(122,106,84,.8)';c.font='20px '+fontName;c.textAlign='right';c.fillText('sekarang',cx+cw-22,cy+49);
    // Avatar: center at ax+ar, ay+ar (cy+100 to cy+176)
    const ax=cx+28,ay=cy+100,ar=38;
    c.beginPath();c.arc(ax+ar,ay+ar,ar,0,Math.PI*2);c.fillStyle='#1a1208';c.fill();c.strokeStyle='rgba(212,168,67,.6)';c.lineWidth=2.5;c.stroke();
    c.fillStyle='#d4a843';c.font='bold 18px '+fontName;c.textAlign='center';c.fillText('XAU',ax+ar,ay+ar-2);c.font='16px '+fontName;c.fillText('♛',ax+ar,ay+ar+16);
    // Name: vertically centered with avatar (cy+138), text to the right of avatar
    c.fillStyle='#f5ede0';c.font='bold 26px '+fontName;c.textAlign='left';c.fillText((cur.sender||'AZZAVISION AI')+' ♥',cx+108,cy+138);
    // Quote text: start below avatar bottom (cy+176) with padding → cy+220
    c.fillStyle='rgba(245,237,224,.92)';c.font='26px '+fontName;
    const maxW=cw-88;// ~884px — tighter wrap for readable line length
    const lines=(cur.quote||'').split('\n');let ty=cy+220;
    for(const l of lines){if(l.trim()===''){ty+=24;continue;}
      if(c.measureText(l).width>maxW){
        const words=l.split(' ');let line='';
        for(const w of words){const test=line?line+' '+w:w;
          if(c.measureText(test).width>maxW&&line){c.fillText(line,cx+28,ty);ty+=42;line=w;}else line=test;}
        if(line){c.fillText(line,cx+28,ty);ty+=42;}}
      else{c.fillText(l,cx+28,ty);ty+=42;}}
    c.fillStyle='rgba(212,168,67,.55)';c.font='bold 22px '+fontName;c.textAlign='center';c.fillText('📲 t.me/azzavisionai',W/2,H-60);
    return cv.toDataURL('image/png');
    }

    }
