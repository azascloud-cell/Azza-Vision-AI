name: Private Panel (Keep-Alive 24h)

on:
  push:
    branches:
      - main
      - master
  schedule:
    # Run every 6 hours → 4 runs/day × ~5h50m each = 24h coverage
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: private-panel
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        working-directory: repo
        run: pnpm install --frozen-lockfile

      - name: Build API server
        working-directory: repo
        run: pnpm --filter "@workspace/api-server" run build

      - name: Build frontend
        working-directory: repo
        env:
          PORT: "8080"
          BASE_PATH: "/"
        run: pnpm --filter "@workspace/azzavision-promo" run build

      - name: Install runtime deps for API server
        working-directory: repo/artifacts/api-server
        run: pnpm install --prod

      - name: Start API server in background
        working-directory: repo/artifacts/api-server
        env:
          PORT: "8080"
          NODE_ENV: production
        run: |
          node ./dist/index.mjs &
          echo $! > /tmp/api.pid
          sleep 3
          curl -sS http://localhost:8080/api/healthz || true

      - name: Serve frontend in background
        working-directory: repo/artifacts/azzavision-promo/dist
        run: |
          npx --yes serve -s . -l 3000 &
          echo $! > /tmp/web.pid
          sleep 3
          curl -sS http://localhost:3000 || true

      - name: Start reverse proxy in background
        run: |
          node .github/scripts/reverse-proxy.mjs &
          echo $! > /tmp/proxy.pid
          sleep 2
          curl -sS http://localhost:8090/api/healthz || true

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Start Cloudflare Tunnel in background
        env:
          CLOUDFLARED_TOKEN: ${{ secrets.CLOUDFLARED_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARED_TOKEN" ]; then
            echo "CLOUDFLARED_TOKEN secret is not set — tunnel disabled"
            exit 0
          fi
          cloudflared tunnel --no-autoupdate run --token "$CLOUDFLARED_TOKEN" \
            --url http://localhost:8090 > /tmp/cloudflared.log 2>&1 &
          echo $! > /tmp/cloudflared.pid
          sleep 5
          cat /tmp/cloudflared.log || true

      - name: Start keep-alive loop (5h 50m)
        run: node .github/scripts/deploy-pterodactyl.mjs
