name: Private Panel (Keep-Alive 24h)

on:
  push:
    branches:
      - main
      - master
  schedule:
    # Run every 6 hours → 4 runs/day × ~5h50m each = 24h coverage
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: private-panel
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        working-directory: repo
        run: pnpm install --frozen-lockfile

      - name: Build API server
        working-directory: repo
        run: pnpm --filter "@workspace/api-server" run build

      - name: Build frontend
        working-directory: repo
        env:
          PORT: "8080"
          BASE_PATH: "/"
        run: pnpm --filter "@workspace/azzavision-promo" run build

      - name: Install runtime deps for API server
        working-directory: repo/artifacts/api-server
        run: pnpm install --prod

      - name: Start API server in background
        working-directory: repo/artifacts/api-server
        env:
          PORT: "8080"
          NODE_ENV: production
        run: |
          node ./dist/index.mjs &
          echo $! > /tmp/api.pid
          sleep 3
          curl -sS http://localhost:8080/api/healthz || true

      - name: Serve frontend in background
        working-directory: repo/artifacts/azzavision-promo/dist
        run: |
          npx --yes serve -s . -l 3000 &
          echo $! > /tmp/web.pid
          sleep 3
          curl -sS http://localhost:3000 || true

      - name: Start reverse proxy in background
        run: |
          node .github/scripts/reverse-proxy.mjs &
          echo $! > /tmp/proxy.pid
          sleep 2
          curl -sS http://localhost:8090/api/healthz || true

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Start Cloudflare Tunnel in background
        env:
          CLOUDFLARED_TOKEN: ${{ secrets.CLOUDFLARED_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARED_TOKEN" ]; then
            echo "Using named tunnel (token-based) — URL is configured in Cloudflare Zero Trust dashboard"
            cloudflared tunnel --no-autoupdate run --token "$CLOUDFLARED_TOKEN" > /tmp/cloudflared.log 2>&1 &
          else
            echo "No CLOUDFLARED_TOKEN set — using quick tunnel (auto-generated URL)"
            cloudflared tunnel --no-autoupdate --url http://localhost:8090 > /tmp/cloudflared.log 2>&1 &
          fi
          echo $! > /tmp/cloudflared.pid
          sleep 8
          cat /tmp/cloudflared.log || true

      - name: Extract and display tunnel URL
        run: |
          # Wait a bit more for the URL to appear in the log
          sleep 5

          # Try to extract the trycloudflare.com URL from the log
          TUNNEL_URL="$(grep -oP 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -1 || true)"

          if [ -n "$TUNNEL_URL" ]; then
            echo "========================================================"
            echo "  PANEL URL:  $TUNNEL_URL"
            echo "========================================================"
            echo "$TUNNEL_URL" > /tmp/tunnel-url.txt
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## 🌐 Panel URL" >> "$GITHUB_STEP_SUMMARY"
            echo "**$TUNNEL_URL**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "This URL is temporary and changes every workflow run." >> "$GITHUB_STEP_SUMMARY"
          elif [ -f /tmp/cloudflared.pid ] && kill -0 "$(cat /tmp/cloudflared.pid)" 2>/dev/null; then
            echo "========================================================"
            echo "  Named tunnel is active."
            echo "  Find your URL in Cloudflare Zero Trust dashboard:"
            echo "  Networks → Tunnels → your tunnel → Public Hostnames"
            echo "========================================================"
            echo "named-tunnel" > /tmp/tunnel-url.txt
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## 🌐 Panel URL" >> "$GITHUB_STEP_SUMMARY"
            echo "Named tunnel is active. Find your URL in the [Cloudflare Zero Trust dashboard](https://one.dash.cloudflare.com/) under **Networks → Tunnels → Public Hostnames**." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Make sure the public hostname routes to `http://localhost:8090`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "========================================================"
            echo "  Tunnel failed to start. Check /tmp/cloudflared.log"
            echo "========================================================"
            cat /tmp/cloudflared.log || true
            echo "failed" > /tmp/tunnel-url.txt
          fi

      - name: Start keep-alive loop (5h 50m)
        run: node .github/scripts/deploy-pterodactyl.mjs
