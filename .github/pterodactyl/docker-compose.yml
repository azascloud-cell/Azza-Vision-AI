x-common:
  database:
    &db-environment
    MYSQL_PASSWORD: &db-password "pterodactyl_db_pass_2024"
    MYSQL_ROOT_PASSWORD: "pterodactyl_root_pass_2024"
  panel:
    &panel-environment
    APP_URL: "http://localhost:8090"
    APP_TIMEZONE: "Asia/Jakarta"
    APP_SERVICE_AUTHOR: "admin@azzavision.local"
  mail:
    &mail-environment
    MAIL_FROM: "noreply@azzavision.local"
    MAIL_DRIVER: "smtp"
    MAIL_HOST: "mail"
    MAIL_PORT: "1025"
    MAIL_USERNAME: ""
    MAIL_PASSWORD: ""
    MAIL_ENCRYPTION: "true"

services:
  database:
    image: mariadb:11
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - "/tmp/pterodactyl/database:/var/lib/mysql"
    environment:
      <<: *db-environment
      MYSQL_DATABASE: "panel"
      MYSQL_USER: "pterodactyl"

  cache:
    image: redis:alpine
    restart: always

  panel:
    image: ghcr.io/pterodactyl/panel:latest
    restart: always
    ports:
      - "8090:80"
    links:
      - database
      - cache
    volumes:
      - "/tmp/pterodactyl/var/:/app/var/"
      - "/tmp/pterodactyl/nginx/:/etc/nginx/http.d/"
      - "/tmp/pterodactyl/certs/:/etc/letsencrypt/"
      - "/tmp/pterodactyl/logs/:/app/storage/logs"
    environment:
      <<: [*panel-environment, *mail-environment]
      DB_PASSWORD: *db-password
      APP_ENV: "production"
      APP_ENVIRONMENT_ONLY: "false"
      CACHE_DRIVER: "redis"
      SESSION_DRIVER: "redis"
      QUEUE_DRIVER: "redis"
      REDIS_HOST: "cache"
      DB_HOST: "database"
      DB_PORT: "3306"
      TRUSTED_PROXIES: "*"
      HASHIDS_LENGTH: 8
    depends_on:
      - database
      - cache

networks:
  default:
    ipam:
      config:
        - subnet: 172.20.0.0/16
